<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 Hãy Chọn Giá Đúng • Đêm Hội Halloween 👻</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #0b0416;
            background-image: 
                radial-gradient(rgba(255, 117, 24, 0.22) 1.5px, transparent 1.5px),
                radial-gradient(rgba(147, 51, 234, 0.2) 1.5px, #0b0416 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .portal-card {
            background: #170729;
            border: 3.5px solid #ff7518;
            border-radius: 28px;
            padding: 36px 26px;
            max-width: 480px;
            width: 100%;
            box-shadow: 6px 6px 0px #000000, 0 20px 60px rgba(255, 117, 24, 0.25);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .logo { font-size: 4.8rem; margin-bottom: 8px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        h1 {
            font-size: 2.1rem;
            color: #fef08a;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 2.5px 2.5px 0px #ea580c, 4px 4px 0px #000000;
        }
        p { color: #fed7aa; font-size: 1.05rem; margin-bottom: 24px; font-weight: 800; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.1s ease;
            cursor: pointer;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
        }
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
        .btn-player {
            background: linear-gradient(135deg, #ff7518, #ea580c 55%, #c026d3);
            color: #fff;
        }
        .btn-host {
            background: #270d42;
            color: #fef08a;
            border-color: #000;
        }
        .btn-review {
            background: #110320;
            color: #fed7aa;
            border: 2px dashed #ff7518;
            font-size: 0.92rem;
            padding: 12px;
            margin-top: 10px;
            box-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="logo">🎃</div>
        <h1>HÃY CHỌN GIÁ ĐÚNG</h1>
        <p>Đêm Hội Spooky Halloween • Trick Or Treat 👻</p>
        
        <a href="player.html" class="btn btn-player">📱 Vào Màn Hình Người Chơi</a>
        <a href="host.html" class="btn btn-host">🖥️ Mở Màn Hình MC / Máy Chiếu</a>
        <a href="review_products_v2.html" class="btn btn-review" style="background:#1e0933; border:2px solid #ff7518; color:#fef08a; font-weight:900;">🔥 Quản Lý Bộ Mix 34 Món Mới</a>
        <a href="review_products.html" class="btn btn-review">🌸 Quản Lý Bộ 20/10 (47 Món Cũ)</a>
    </div>

    <script>
        // Tự động chuyển hướng nếu người dùng mở bằng điện thoại
        const isMobile = /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            window.location.replace("player.html");
        }
    </script>
</body>
</html>
